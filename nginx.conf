# PDFs have the same canonical host as the HTML pages; query strings are excluded.
map $uri $pdf_canonical {
    default "";
    ~^(/docs/[^/]+\.pdf)$ '<https://www.amakidsaps.it$1>; rel="canonical"';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Keep one public hostname, preserving paths and contact-form parameters.
    if ($host = amakidsaps.it) {
        return 301 https://www.amakidsaps.it$request_uri;
    }
    rewrite ^/(.+)/$ /$1 permanent;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml font/woff2;
    gzip_min_length 1024;

    add_header Link $pdf_canonical always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'" always;

    # Asset con hash nel nome: cache lunga e immutabile
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Each public route has its own HTML head; unknown routes keep the SPA fallback.
    location / {
        try_files $uri/index.html $uri /index.html;
    }
}
